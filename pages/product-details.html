<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المنتج</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
</head>

<body>
  <header class="pd-header">
    <div class="pd-header__inner">
      <a href="../index.html" class="pd-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6" />
        </svg>
        العودة للمتجر
      </a>

      <div style="flex: 1"></div>

      <div class="logo-wrap">
        <svg class="logo-bow" viewBox="0 0 60 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 15 C20 5, 5 5, 8 15 C5 25, 20 25, 30 15Z" fill="#e8748a" opacity="0.8" />
          <path d="M30 15 C40 5, 55 5, 52 15 C55 25, 40 25, 30 15Z" fill="#e8748a" opacity="0.8" />
          <circle cx="30" cy="15" r="4" fill="#e8748a" />
        </svg>

        <div class="logo-text">
          <span class="logo-name">Amoora Bloom</span>
          <span class="logo-tagline">هدايا صُنعت بكل حُب </span>
        </div>
      </div>
    </div>
  </header>

  <main class="pd-main">
    <div class="pd-inner" id="pdInner">
      <div class="pd-gallery">
        <div class="pd-gallery__main">
          <img id="mainImg" src="" alt="صورة المنتج" />
        </div>

        <div class="pd-gallery__thumbs" id="thumbs"></div>
      </div>

      <div class="pd-info">
        <span class="pd-info__tag" id="pdTag">هدايا فاخرة</span>
        <h1 class="pd-info__name" id="pdName">اسم المنتج</h1>
        <div class="pd-info__price" id="pdPrice">-- <span>ر.س</span></div>

        <div class="pd-info__divider"></div>

        <p class="pd-info__desc" id="pdDesc">وصف المنتج يظهر هنا...</p>

        <div class="pd-info__divider"></div>

        <div class="pd-info__features" id="pdFeatures"></div>

        <div class="pd-actions">
          <button class="btn btn--whatsapp" id="pdWhatsapp">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
            </svg>
            اطلب الآن عبر الواتس اب
          </button>

          <a href="../index.html#products" class="btn btn--outline" id="moreProductsBtn">
            مشاهدة المزيد من المنتجات
          </a>
        </div>
      </div>
    </div>
  </main>

  <button class="float-whatsapp" id="floatWhatsapp" aria-label="واتس اب">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.570-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
    </svg>
  </button>

  <script>
    const WHATSAPP_NUMBER = '966500959110';

    const products = {
      '1': {
        name: ' فازة ورد طبيعي وكيك',
        tag: 'ورد وكيك',
        price: '190',
        desc: 'فازة ورد بلونك المفضل مع بالونات وكيك تختارينه على ذوقك، هدية ناعمة ومميزة لكل مناسبة 💗🎀',
        features: [
          'فازة ورد ( الورد من اختيارك ) ',
          'كيك ( تفاصيل الحشوة والرسم على الواتس )  ',
          'بالونتين هيليوم',
          ' كرت شكر واهداء ',
          ' ستيكرات'
        ],
        images: [
          '/assets/product/ورد (2).jpeg',
          '/assets/product/ورد (1).jpeg',
          '/assets/product/ورد.jpeg'
        ]
      },

      '2': {
        name: ' فازة دوار الشمس',
        tag: 'فازات الورد',
        price: '130',
        desc: 'فازة دوّار شمس بتنسيق دافي ومبهج، تناسب كل شخص يحب الألوان المشرقة 🌻💛',
        features: [
          ' فازة دوار شمس',
          'ميدالية دوار شمس',
          'كرت شكر واهداء',
          'ستيكرات '
        ],
        images: [
          '/assets/product/فازة دوار الشمس (2).jpg',
          '/assets/product/فازة دوار الشمس.jpg'
        ]
      },

      '3': {
        name: 'بوكس ورد وكيك',
        tag: 'ورد وكيك',
        price: '210',
        desc: 'بوكس ورد وكيك بتفاصيل ناعمة ومليانة حب، لكل المُناسبات الحلوة 🎀💕',
        features: [
          ' ورد على اختيارك',
          ' كيك',
          ' ميدالية',
          'كرت شكر واهداء ',
          'ستيكرات '
        ],
        images: [
          '/assets/product/بوكس ورد طبيعي وكيك (4).jpg',
          '/assets/product/بوكس ورد طبيعي وكيك (3).jpg',
          '/assets/product/بوكس ورد طبيعي وكيك (2).jpg',
          '/assets/product/بوكس ورد طبيعي وكيك.jpg'
        ]
      },

      '4': {
        name: 'هيلوكيتي وميدالية',
        tag: 'الدمى',
        price: '100',
        desc: 'هدية هيلوكيتي بتفاصيل وردية لطيفة مع ميدالية وبالون 💗🎀',
        features: [
          'هيلوكيتي ',
          'ميدالية',
          'بالون هيليوم ',
          'كرت اهداء وشكر ',
          'ستيكرات'
        ],
        images: [
          '/assets/product/هيلوكيتي وميدالية (2).jpg',
          '/assets/product/هيلوكيتي وميدالية.jpg'
        ]
      }
    };

    function getParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    function loadProduct() {
      const id = getParam('id') || '1';
      const from = getParam('from');
      const p = products[id] || products['1'];

      document.title = `${p.name} - Amoora Bloom`;

      document.getElementById('pdName').textContent = p.name;
      document.getElementById('pdTag').textContent = p.tag;
      document.getElementById('pdPrice').innerHTML = `${p.price} <span>ر.س</span>`;
      document.getElementById('pdDesc').textContent = p.desc;

      const featEl = document.getElementById('pdFeatures');

      featEl.innerHTML = p.features
        .map((f) => `<div class="pd-feature">${f}</div>`)
        .join('');

      const mainImg = document.getElementById('mainImg');
      mainImg.src = p.images[0];
      mainImg.alt = p.name;

      const thumbsEl = document.getElementById('thumbs');

      thumbsEl.innerHTML = p.images
        .map(
          (src, i) =>
            `<img src="${src}" alt="صورة ${i + 1}" class="${i === 0 ? 'active' : ''}" data-idx="${i}" />`
        )
        .join('');

      thumbsEl.querySelectorAll('img').forEach((thumb) => {
        thumb.addEventListener('click', () => {
          mainImg.src = p.images[+thumb.dataset.idx];

          thumbsEl.querySelectorAll('img').forEach((t) => {
            t.classList.remove('active');
          });

          thumb.classList.add('active');
        });
      });

      const moreProductsBtn = document.getElementById('moreProductsBtn');

      if (from === 'flower-vases') {
        moreProductsBtn.href = '/pages/flower-vases.html';
      } else if (from === 'dolls') {
        moreProductsBtn.href = '/pages/dolls.html';
      } else if (from === 'rose-cake') {
        moreProductsBtn.href = '/pages/rose-cake.html';
      } else if (from === 'doll-cake') {
        moreProductsBtn.href = '/pages/doll-cake.html';
      } else {
        moreProductsBtn.href = '../index.html#products';
      }

      const msg = `مرحباً، أود طلب: ${p.name} بسعر ${p.price} ر.س 🌸`;
      const wa = encodeURIComponent(msg);

      document.getElementById('pdWhatsapp').addEventListener('click', () => {
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${wa}`, '_blank');
      });

      document.getElementById('floatWhatsapp').addEventListener('click', () => {
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${wa}`, '_blank');
      });
    }

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
