    function getParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    function loadProduct() {
      const id = getParam('id') || '1';
      const from = getParam('from');

      const p = from === 'rose-cake'
        ? roseCakeProducts[id] || products[id] || products['1']
        : products[id] || products['1'];

      document.title = `${p.name} - Amoora Bloom`;

      document.getElementById('pdName').textContent = p.name;
      document.getElementById('pdTag').textContent = p.tag;
      document.getElementById('pdPrice').innerHTML = `${p.price} <span>ر.س</span>`;
      document.getElementById('pdDesc').textContent = p.desc;

      const featEl = document.getElementById('pdFeatures');

      featEl.innerHTML = p.features
        .map((f) => `<div class="pd-feature">${f}</div>`)
        .join('');

      const mainImg = document.getElementById('mainImg');
      mainImg.src = p.images[0];
      mainImg.alt = p.name;

      const thumbsEl = document.getElementById('thumbs');

      thumbsEl.innerHTML = p.images
        .map(
          (src, i) =>
            `<img src="${src}" alt="صورة ${i + 1}" class="${i === 0 ? 'active' : ''}" data-idx="${i}" />`
        )
        .join('');

      thumbsEl.querySelectorAll('img').forEach((thumb) => {
        thumb.addEventListener('click', () => {
          mainImg.src = p.images[+thumb.dataset.idx];

          thumbsEl.querySelectorAll('img').forEach((t) => {
            t.classList.remove('active');
          });

          thumb.classList.add('active');
        });
      });

      const moreProductsBtn = document.getElementById('moreProductsBtn');

      if (from === 'flower-vases') {
        moreProductsBtn.href = '/pages/flower-vases.html';
      } else if (from === 'dolls') {
        moreProductsBtn.href = '/pages/dolls.html';
      } else if (from === 'rose-cake') {
        moreProductsBtn.href = '/pages/rose-cake.html';
      } else if (from === 'doll-cake') {
        moreProductsBtn.href = '/pages/doll-cake.html';
      } else if (from === 'artificial-flowers') {
        moreProductsBtn.href = '/pages/artificial-flowers.html';
      } else {
        moreProductsBtn.href = '../index.html#products';
      }

      const imageUrl = new URL(p.images[0], window.location.origin).href;

      const msg = `مرحباً، أود طلب:

🌸 المنتج: ${p.name}
💰 السعر: ${p.price} ر.س
📝 الوصف: ${p.desc}
🖼️ صورة المنتج: ${imageUrl}`;

      const wa = encodeURIComponent(msg);

      document.getElementById('pdWhatsapp').addEventListener('click', () => {
        window.open(
          `https://wa.me/${WHATSAPP_NUMBER}?text=${wa}`,
          '_blank'
        );
      });

      document.getElementById('floatWhatsapp').addEventListener('click', () => {
        window.open(
          `https://wa.me/${WHATSAPP_NUMBER}?text=${wa}`,
          '_blank'
        );
      });
    }

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
